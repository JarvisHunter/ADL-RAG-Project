<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
    <style>
      .box{fill:#fcfcfb;stroke:#898781;stroke-width:1.2;rx:7}
      .hl{fill:#fff4ec;stroke:#c2410c;stroke-width:1.6}
      .t{font-size:12.5px;fill:#0b0b0b;font-weight:600;text-anchor:middle}
      .s{font-size:10.5px;fill:#52514e;text-anchor:middle}
      .lane{font-size:11px;fill:#898781;font-weight:700;letter-spacing:.08em}
      .ln{stroke:#52514e;stroke-width:1.3;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <text class="lane" x="10" y="20">INDEXING (once, or when files/settings change)</text>
  <rect class="box" x="10" y="32" width="140" height="62" rx="7"/><text class="t" x="80" y="58">Documents</text><text class="s" x="80" y="76">PDF · TXT · MD</text>
  <rect class="box" x="180" y="32" width="150" height="62" rx="7"/><text class="t" x="255" y="58">Load &amp; clean</text><text class="s" x="255" y="76">pypdf, one doc per page</text>
  <rect class="box" x="360" y="32" width="140" height="62" rx="7"/><text class="t" x="430" y="58">Chunk</text><text class="s" x="430" y="76">1000 chars, 200 overlap</text>
  <rect class="box" x="530" y="32" width="150" height="62" rx="7"/><text class="t" x="605" y="58">Embed</text><text class="s" x="605" y="76">mxbai-embed-large</text>
  <rect class="box" x="710" y="32" width="140" height="62" rx="7"/><text class="t" x="780" y="58">ChromaDB</text><text class="s" x="780" y="76">cosine · manifest</text>
  <path class="ln" d="M150 63 H178"/><path class="ln" d="M330 63 H358"/><path class="ln" d="M500 63 H528"/><path class="ln" d="M680 63 H708"/>

  <text class="lane" x="10" y="140">QUESTION ANSWERING (every turn)</text>
  <rect class="box" x="10" y="152" width="140" height="66" rx="7"/><text class="t" x="80" y="178">Question</text><text class="s" x="80" y="196">+ chat history</text>
  <rect class="box" x="180" y="152" width="150" height="66" rx="7"/><text class="t" x="255" y="178">Retrieve top-k</text><text class="s" x="255" y="196">question (+ previous one)</text>
  <rect class="box hl" x="360" y="152" width="140" height="66" rx="7"/><text class="t" x="430" y="178">Relevance gate</text><text class="s" x="430" y="196">min similarity (calibrated)</text>
  <rect class="box hl" x="530" y="152" width="150" height="66" rx="7"/><text class="t" x="605" y="174">Prompt</text><text class="s" x="605" y="191">context + history +</text><text class="s" x="605" y="205">question + rule reminder</text>
  <rect class="box" x="710" y="152" width="140" height="66" rx="7"/><text class="t" x="780" y="178">LLM (Ollama)</text><text class="s" x="780" y="196">qwen3.5 · llama · gemma</text>
  <path class="ln" d="M150 185 H178"/><path class="ln" d="M330 185 H358"/><path class="ln" d="M500 185 H528"/><path class="ln" d="M680 185 H708"/>
  <path class="ln" d="M780 94 V120 H255 V150" stroke-dasharray="4 3"/>
  <text class="s" x="520" y="114" style="text-anchor:middle">vector search</text>

  <rect class="box" x="600" y="252" width="250" height="56" rx="7"/><text class="t" x="725" y="275">Answer + [file p.N] citations</text><text class="s" x="725" y="293">streamed to Streamlit UI or CLI</text>
  <path class="ln" d="M780 218 V250"/>
  <rect class="box hl" x="250" y="252" width="300" height="56" rx="7"/><text class="t" x="400" y="275">“I could not find this in the documents.”</text><text class="s" x="400" y="293">strict mode, nothing relevant: no LLM call</text>
  <path class="ln" d="M430 218 V250"/>
  <rect x="10" y="270" width="14" height="14" rx="3" fill="#fff4ec" stroke="#c2410c" stroke-width="1.6"/><text class="s" x="30" y="281" style="text-anchor:start">added after testing</text>
</svg>
